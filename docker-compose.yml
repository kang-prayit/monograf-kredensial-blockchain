# Jalankan seluruh prototipe dengan satu perintah:  docker compose up -d
services:
  chain:
    image: node:20-alpine
    working_dir: /hh
    volumes: ["./hardhat:/hh"]
    command: sh -c "npm install --no-audit --no-fund && npx hardhat node --hostname 0.0.0.0 --port 8545"
    ports: ["8545:8545"]
    restart: unless-stopped
  app:
    build: .
    environment:
      CHAIN_RPC: http://chain:8545
      ISSUER_NAME: "Lembaga Contoh (Prototipe)"
    volumes:
      - ./analytics/data:/app/analytics/data
      - appdata:/data
    ports: ["8000:8000"]
    depends_on: [chain]
    restart: unless-stopped
volumes:
  appdata:
